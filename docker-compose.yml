# No database service: the orchestrator defaults to a SQLite file under the
# bind-mounted evidence/ directory (persists across `docker compose down`/
# `up`, visible on the host at ./evidence/ape.db). To use PostgreSQL instead,
# add a `postgres` service back and set APE_DATABASE_URL accordingly on the
# orchestrator service below — no code change needed (app/database/session.py
# builds its engine generically from that URL).
#
# Also no `probe` service: the Network Discovery Probe (probe/) needs
# raw-socket/admin access and normally runs directly on a host, not in a
# container — run `python -m probe` separately and point the orchestrator
# at it with APE_PROBE_API_URL (see below and README.md's "Network
# Discovery Probe integration").

services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"

  # --- Specialist agent services --------------------------------------------
  # Optional: the orchestrator runs the Web/Binary agent code in-process by
  # default (simpler for local dev — see app/core/config.py). Set
  # APE_WEB_AGENT_SERVICE_URL / APE_BINARY_AGENT_SERVICE_URL on the
  # orchestrator service (uncommented below) to dispatch to these instead,
  # matching PRD Part 10's "FastAPI for service communication" model.
  web-agent:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      APE_ZAP_API_URL: http://zap:8080
      APE_WEB_AGENT_USE_FIXTURES: "true"
      APE_EVIDENCE_DIR: /data/evidence
    volumes:
      - ./evidence:/data/evidence
    ports:
      - "8001:8001"
    depends_on:
      - zap

  binary-agent:
    build:
      context: .
      dockerfile: Dockerfile.binary
    restart: unless-stopped
    environment:
      APE_BINARY_AGENT_USE_FIXTURES: "true"
      APE_EVIDENCE_DIR: /data/evidence
    volumes:
      - ./inputs/binaries:/data/inputs/binaries:ro
      - ./evidence:/data/evidence
    ports:
      - "8002:8002"

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Absolute path (sqlite:////...) under the bind-mounted evidence
      # volume below, so the database survives container recreation and is
      # inspectable on the host at ./evidence/ape.db.
      APE_DATABASE_URL: sqlite:////data/evidence/ape.db
      APE_ZAP_API_URL: http://zap:8080
      APE_EVIDENCE_DIR: /data/evidence
      APE_INPUTS_DIR: /data/inputs
      APE_NETWORK_GRAPH_DIR: /data/inputs/network_graphs
      APE_BINARIES_DIR: /data/inputs/binaries
      APE_REPORTS_DIR: /data/evidence/reports
      # Docker Desktop (Windows/Mac) resolves this to the host; on Linux use
      # the host's bridge/LAN IP instead. Leave unset (or blank) to disable
      # the live Probe integration and require network_graph_path per request.
      APE_PROBE_API_URL: http://host.docker.internal:8080
      # Uncomment to dispatch to the standalone agent services instead of
      # running their code in-process:
      # APE_WEB_AGENT_SERVICE_URL: http://web-agent:8001
      # APE_BINARY_AGENT_SERVICE_URL: http://binary-agent:8002
    volumes:
      - ./inputs/network_graphs:/data/inputs/network_graphs:ro
      - ./inputs/binaries:/data/inputs/binaries:ro
      - ./evidence:/data/evidence
    ports:
      - "8000:8000"
    extra_hosts:
      # host.docker.internal resolves out of the box on Docker Desktop
      # (Windows/Mac); this makes it also resolve on Linux (Docker Engine
      # 20.10+), so APE_PROBE_API_URL above works unmodified everywhere.
      - "host.docker.internal:host-gateway"
    depends_on:
      zap:
        condition: service_started
